name: Post to Instagram

# Posts whatever is due in schedule.json.
# Main timer: cron-job.org starts this workflow (workflow_dispatch) a few
# minutes before each post; post_due.py waits until the exact time.
# GitHub's own cron below is only a backup: on 30 Sep 2026 it never fired
# once in 5 hours. Kept to twice an hour to stay well inside the free
# Actions minutes of a private repo.
on:
  schedule:
    - cron: "13,43 4-16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest schedule
        # a run started just after another can be checked out before the
        # other saved "posted"; pulling here stops a double post
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Post anything due
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: python post_due.py
      - name: Save the updated schedule
        if: always()
        run: |
          if ! git diff --quiet schedule.json; then
            git config user.name "gooseecrumbs-bot"
            git config user.email "actions@users.noreply.github.com"
            git add schedule.json
            git commit -m "Update post status"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep 5
            done
          fi
